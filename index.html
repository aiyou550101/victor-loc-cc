<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>victor.loc.cc</title>
<style>
  :root { --bg:#fafaf8; --fg:#1c1c1a; --muted:#77776f; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111113; --fg:#ececea; --muted:#8c8c86; --accent:#7aa2ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 0 16px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", sans-serif;
  }
  main { text-align: center; }
  h1 { margin: 0 0 .4em; font-size: clamp(1.8rem, 6vw, 2.8rem); font-weight: 600; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>victor<span>.loc.cc</span></h1>
